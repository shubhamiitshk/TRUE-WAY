# TrueWay Scholar POI Submission Worksheet Template
# Version: 1.0 (Bodh Gaya - Rajgir - Nalanda Heritage Corridor)
#
# INSTRUCTIONS FOR RESEARCHERS & POSTGRADUATE SCHOLARS:
# 1. Fill out one worksheet per Point of Interest (POI) or monument structure.
# 2. Every statement of fact must be classified under TrueWay's Epistemic Framework:
#    - DOCUMENTED: Physical in-situ epigraphy, published archaeological reports (ASI/Cunningham/Marshall).
#    - INTERPRETATION: Scholarly consensus or academic hypothesis with named historian source.
#    - TRADITION: Living devotional tradition, oral history, or pilgrimage folklore.
#    - CONTESTED: Actively disputed historical attribution or dating between recognized scholars.
# 3. All submissions must pass the automated validator before honorarium release:
#    python content/tools/validate_scholar_submission.py <path_to_worksheet.yaml>


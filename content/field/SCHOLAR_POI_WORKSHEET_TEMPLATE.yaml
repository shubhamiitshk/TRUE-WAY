claims:
  - claim_id: "CLM-NAL-0301"
    claim_type: "DOCUMENTED"
    claim_text: "Temple 3 consists of seven successive architectural envelopes built directly over one another from the Gupta period (5th century CE) through the Pala period (11th century CE)."
    sources:
      - author: "Spooner, Dr. David B."
        title: "Excavations at Nalanda"
        publication_year: 1916
        citation_detail: "Archaeological Survey of India Annual Report 1915-16, Part I, pp. 33-38, Plate XVI"
      - author: "Ghosh, A."
        title: "Nalanda"
        publication_year: 1965
        citation_detail: "Archaeological Survey of India Guidebook (6th ed.), pp. 14-19"

  - claim_id: "CLM-NAL-0302"
    claim_type: "DOCUMENTED"
    claim_text: "The fifth architectural stratum reveals high-relief stucco images of the Buddha and Bodhisattvas (including Avalokiteshvara and Manjushri) displaying classical Gupta artistic idioms."
    sources:
      - author: "Cunningham, Sir Alexander"
        title: "Report of Tours in Bundelkhand and Malwa, and in the Central Provinces"
        publication_year: 1880
        citation_detail: "Archaeological Survey of India Reports, Vol. I & III, pp. 28-36"

  - claim_id: "CLM-NAL-0303"
    claim_type: "TRADITION"
    claim_text: "Tibetan and Chinese pilgrim chronicles record that this stupa-temple enshrines relics of Shariputra (Sariputta), the foremost disciple of Gautama Buddha in wisdom, who was born and attained parinirvana in nearby Kalapinaka/Nalaka village."
    sources:
      - author: "Xuanzang (trans. Samuel Beal)"
        title: "Si-Yu-Ki: Buddhist Records of the Western World"
        publication_year: 1884
        citation_detail: "Trubner Oriental Series, Book IX, pp. 175-177"
      - author: "Taranatha (trans. Chimpa & Chattopadhyaya)"
        title: "History of Buddhism in India"
        publication_year: 1970
        citation_detail: "Indian Institute of Advanced Study, Simla, Chapter 18, pp. 102-105"

audio_narrative_scripts:
  english_script: >
    Welcome to Temple Site Number 3, the monumental icon of Nalanda Mahavihara. Standing before
    this colossal brick tower, you are witnessing twelve hundred years of devotion encased in
    concentric layers of terracotta. Rather than dismantling older sanctums, Buddhist architects over
    seven successive eras simply encased the existing structure within a larger brick shell.
    As you examine the northern corner of the fifth envelope, look closely at the exquisite stucco
    Bodhisattvas. These five-foot figures survive from the sixth century, their serene downcast eyes
    and flowing drapery representing the pinnacle of classical Gupta sculptural craftsmanship.
  hindi_script: >
    नालंदा महाविहार के भव्य मंदिर संख्या ३ में आपका स्वागत है। आपके समक्ष स्थित यह विशाल ईंटों का स्तूप
    बारह सौ वर्षों की निरंतर साधना और निर्माण परंपरा का जीवंत प्रमाण है। प्राचीन काल में पुराने मंदिर को
    तोड़ने के बजाय, विभिन्न कालखंडों के शिल्पकारों ने इसके ऊपर सात क्रमिक परतों का निर्माण किया।
    इसके पांचवें स्तर पर बनी गुप्तकालीन गच प्रतिमाओं को ध्यान से देखें—यहाँ बोधिसत्व अवलोकितेश्वर की
    शांत और करुणामयी मुद्रा भारतीय शास्त्रीय मूर्तिकला का अनुपम उदाहरण प्रस्तुत करती है।
  pronunciation_ipa: "/naːlənˈdaː ˈtɛmpəl naɪn/ (Hindi: [naːlən̪d̪aː mən̪d̪ɪr])"
  estimated_duration_seconds: 95
